spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:ledger_db}
    username: ${POSTGRES_USER:ledger_user}
    password: ${POSTGRES_PASSWORD:ledger_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081