name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ledger-service, orchestration-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and unit test
        working-directory: ${{ matrix.service }}
        run: ./mvnw clean verify -B
        # Testcontainers-based integration tests run here too — verify pulls in
        # any test-scoped Testcontainers deps automatically via the surefire/failsafe lifecycle.
        # GitHub Actions runners have Docker preinstalled, so Testcontainers works out of the box.

      - name: Build Docker image
        working-directory: ${{ matrix.service }}
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ matrix.service }}:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}

  deploy-local-simulation:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy stage (local simulation only)
        run: |
          echo "This stage documents the deploy step for portfolio purposes."
          echo "A GitHub Actions runner is an ephemeral cloud VM and cannot be"
          echo "a real target for a laptop-only Kind cluster — Kind only exists"
          echo "on the developer's machine, not in CI infrastructure."
          echo "In a real environment this stage would run 'kubectl apply' or"
          echo "a Helm upgrade against a persistent, network-reachable cluster"
          echo "(e.g. an EKS cluster, which is exactly what the AWS credits"
          echo "would be used for as a stretch goal)."