version: '3.8'

services:
  postgres-orchestration:
    image: postgres:16-alpine
    container_name: orchestration-postgres
    environment:
      POSTGRES_DB: orchestration_db
      POSTGRES_USER: orchestration_user
      POSTGRES_PASSWORD: orchestration_pass
    ports:
      - "5433:5433"
    command: ["postgres", "-p", "5433"]
    volumes:
      - orchestration_pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: local-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://local-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@local-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: local-kafka:29092
    depends_on:
      - kafka

volumes:
  orchestration_pgdata:
